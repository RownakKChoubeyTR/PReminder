# ─────────────────────────────────────────────────────────────
# PReminder — Deploy to Azure App Service
# ─────────────────────────────────────────────────────────────
# Triggers ONLY after the CI workflow passes on main.
# This guarantees: lint + tests + build all green before deploy.
#
# Flow:
#   CI passes on main → this workflow runs → build standalone →
#   zip → configure App Service → deploy
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   AZUREAPPSERVICE_CLIENTID_*   — Created automatically by Deployment Center
#   AZUREAPPSERVICE_TENANTID_*   — Created automatically by Deployment Center
#   AZUREAPPSERVICE_SUBSCRIPTIONID_* — Created automatically by Deployment Center
#
# App Service settings managed by this workflow (no Portal action needed):
#   ENABLE_ORYX_BUILD=false      — prevents Oryx from re-building our pre-built package
#   WEBSITES_PORT=3000           — tells Azure to route to the port Next.js listens on
#   startup command: node server.js
# ─────────────────────────────────────────────────────────────

name: Deploy

on:
    # Only run after CI passes on main — never on PRs, never on failure.
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    # Allow manual re-deploy without a code push.
    workflow_dispatch:

# Never run two deploys simultaneously — queue them.
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Required for OIDC login to Azure

env:
    NODE_VERSION: '20'
    PNPM_VERSION: '9'

jobs:
    deploy:
        name: Build & Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # For workflow_run: skip if CI failed. For workflow_dispatch: always run.
        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js ${{ env.NODE_VERSION }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            # Reuse cached Next.js build chunks — speeds up deploy significantly.
            - name: Restore Next.js build cache
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: nextjs-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{ts,tsx,scss}') }}
                  restore-keys: |
                      nextjs-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      nextjs-deploy-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm db:generate

            # DOCKER_BUILD=true activates output: 'standalone' in next.config.ts.
            # Standalone bundles a minimal Node.js server + only the required deps.
            - name: Build (standalone mode)
              run: pnpm build
              env:
                  DOCKER_BUILD: 'true'
                  SKIP_ENV_VALIDATION: '1'
                  NEXT_TELEMETRY_DISABLED: '1'
                  # Placeholder DB vars — composeDatabaseUrl() throws at build time
                  # if these are absent. Real values are injected via Azure App Settings.
                  DB_HOST: placeholder
                  DB_PORT: '5432'
                  DB_USER: placeholder
                  DB_PASSWORD: placeholder
                  DB_NAME: placeholder

            # Standalone output layout:
            #   .next/standalone/               ← server.js + minimal node_modules
            #   .next/standalone/.next/static/  ← JS/CSS chunks (copied from build)
            #   .next/standalone/public/        ← static public assets (copied)
            - name: Package standalone for deployment
              run: |
                  cp -r .next/static .next/standalone/.next/static
                  cp -r public .next/standalone/public
                  cd .next/standalone

                  # Next.js copies the full project package.json here during the build.
                  # Oryx finds it, reads the ~50 listed dependencies, and runs a full
                  # npm install — adding 5-6 minutes to every deploy even when
                  # ENABLE_ORYX_BUILD=false is set (race condition: the deploy API call
                  # fires before the app-setting restart fully propagates).
                  # server.js has no runtime dependency on this file; removing it is safe.
                  rm -f package.json

                  zip -r "$GITHUB_WORKSPACE/deploy.zip" . --quiet
                  echo "deploy.zip size: $(du -sh "$GITHUB_WORKSPACE/deploy.zip" | cut -f1)"

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE994DDFDABB4116AADE8D8F097C2193 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56FAA57AD13A41B0817A18F59B855661 }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5DBDD34999C4D27B0E40A7E492704CE }}

            - name: Configure App Service
              # Must run BEFORE the zip deploy so settings are active when Azure
              # processes the upload.
              #
              #   ENABLE_ORYX_BUILD=false
              #     Disables Oryx for zip deployments. (SCM_DO_BUILD_DURING_DEPLOYMENT
              #     only covers Git/SCM pushes — zip deploys need this flag.)
              #     Without it, Oryx detects package.json, runs npm install, creates
              #     node_modules.tar.gz, and overwrites our standalone node_modules on
              #     startup — breaking the server.
              #
              #   WEBSITES_PORT=3000
              #     Next.js standalone server.js listens on process.env.PORT (default
              #     3000). Azure App Service routes incoming traffic to port 8080 by
              #     default. Without this setting Azure's health-check hits the wrong
              #     port, marks the app as unresponsive, and keeps restarting it.
              run: |
                  az webapp config appsettings set \
                    --resource-group preminder-rg \
                    --name tr-preminder \
                    --settings \
                      ENABLE_ORYX_BUILD=false \
                      SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                      WEBSITES_PORT=3000

                  # Pin the startup command so Azure never auto-detects the wrong one.
                  az webapp config set \
                    --resource-group preminder-rg \
                    --name tr-preminder \
                    --startup-file "node server.js"

            - name: Deploy to Azure App Service
              # --clean wipes /home/site/wwwroot before extracting, preventing stale
              # Oryx artefacts from a previous run clobbering the standalone output.
              # --async submits without waiting for the full startup probe (avoids
              # the CLI's default 10-minute polling timeout).
              run: |
                  az webapp deploy \
                    --resource-group preminder-rg \
                    --name tr-preminder \
                    --src-path "$GITHUB_WORKSPACE/deploy.zip" \
                    --type zip \
                    --clean true \
                    --async true

            - name: Write deploy summary
              if: always()
              run: |
                  echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ "${{ job.status }}" = "success" ]; then
                    echo "✅ Deployed to Azure App Service \`tr-preminder\`" >> "$GITHUB_STEP_SUMMARY"
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "App URL: https://tr-preminder.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "❌ Deploy failed — check the step logs above." >> "$GITHUB_STEP_SUMMARY"
                  fi
